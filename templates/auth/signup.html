{% extends "auth/auth_base.html" %}
{% block title %}Sign up{% endblock %}

{% block content %}
<h2>Create your account</h2>
<p class="auth-sub">Join your hospital's staff workspace.</p>

<form method="post" class="form">
  <div class="field">
    <label for="name">Full name</label>
    <input id="name" type="text" name="name" value="{{ form.name }}"
           maxlength="80" autocomplete="name" required>
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" value="{{ form.email }}"
           maxlength="120" placeholder="you@hospital.com" autocomplete="email" required>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="password-field">
      <input id="password" type="password" name="password"
             minlength="8" autocomplete="new-password" required>
      <button type="button" class="toggle-password" aria-label="Show password">👁</button>
    </div>
    <span class="field-hint">At least 8 characters</span>
  </div>

  <div class="field">
    <label for="confirm">Confirm password</label>
    <div class="password-field">
      <input id="confirm" type="password" name="confirm"
             minlength="8" autocomplete="new-password" required>
      <button type="button" class="toggle-password" aria-label="Show password">👁</button>
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-block">Create account</button>
</form>

<p class="auth-switch">
  Already have an account? <a href="{{ url_for('login') }}">Log in</a>
</p>
{% endblock %}
